    function calculateDistance(lat1, lng1, lat2, lng2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLng/2) * Math.sin(dLng/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function getDistance(restaurant) {
        return calculateDistance(SCHOOL.lat, SCHOOL.lng, restaurant.lat, restaurant.lng);
    }

    function formatDistance(km) {
        if (km < 1) return Math.round(km * 1000) + 'm';
        return km.toFixed(1) + 'km';
    }

    function renderStars(rating) {
        const full = Math.floor(rating);
        const half = rating - full >= 0.5;
        let html = '';
        for (let i = 0; i < full; i++) html += '<span style="color:#F5A623;">\u2605</span>';
        if (half) html += '<span style="color:#F5A623;">\u2605</span>';
        for (let i = full + (half ? 1 : 0); i < 5; i++) html += '<span style="color:#ddd;">\u2605</span>';
        return html;
    }

    function getRestaurantById(id) {
        return RESTAURANTS.find(r => r.id === id);
    }

    function getReviews(restaurantId) {
        const key = 'halal_reviews_' + restaurantId;
        const stored = localStorage.getItem(key);
        if (stored) {
            try { return JSON.parse(stored); } catch(e) {}
        }
        const restaurant = getRestaurantById(restaurantId);
        const initial = restaurant ? (restaurant.reviews || []) : [];
        try { localStorage.setItem(key, JSON.stringify(initial)); } catch(e) {}
        return initial;
    }

    function saveReview(restaurantId, review) {
        const reviews = getReviews(restaurantId);
        reviews.unshift(review);
        try { localStorage.setItem('halal_reviews_' + restaurantId, JSON.stringify(reviews)); } catch(e) {
            review.photo = null;
            reviews[0] = review;
            try { localStorage.setItem('halal_reviews_' + restaurantId, JSON.stringify(reviews)); } catch(e2) {}
        }
    }

    function resizeImage(file, maxWidth, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const scale = Math.min(1, maxWidth / img.width);
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                callback(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function showToast(message) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 2000);
    }

    /* ==================== 视图切换 ==================== */

    function switchView(view) {
        document.querySelectorAll('.view').forEach(function(v) { v.classList.add('hidden'); });
        document.getElementById(view + '-view').classList.remove('hidden');
        document.querySelectorAll('.nav-btn').forEach(function(btn) {
            btn.classList.toggle('active', btn.dataset.view === view);
        });
        currentView = view;
        if (view === 'map') {
            if (!mapInitialized) initMap();
            closeMapPopup();
        }
    }

    function showDetail(id, from) {
        closeMapPopup();
        previousView = from || 'map';
        currentRestaurantId = id;
        renderDetail(id);
        switchView('detail');
    }

    function goBack() {
        switchView(previousView);
    }

    function viewOnMap(id) {
        var r = getRestaurantById(id);
        switchView('map');
        if (r) {
            var pos = latLngToXY(r.lat, r.lng);
            var svg = document.getElementById('map-svg');
            var rect = svg.getBoundingClientRect();
            var sx = (pos.x / 800) * rect.width;
            var sy = (pos.y / 600) * rect.height;
            setTimeout(function() {
                showMapPopupAtScreen(sx, sy, buildPopupHTML(r));
            }, 100);
        }
    }

    /* ==================== 列表页 ==================== */

    function renderList(sortBy) {
        currentSort = sortBy || currentSort;
        document.querySelectorAll('.sort-btn').forEach(function(btn) {
            btn.classList.toggle('active', btn.dataset.sort === currentSort);
        });

        var searchText = document.getElementById('search-input').value.toLowerCase();
        var filtered = RESTAURANTS.filter(function(r) {
            return r.name.toLowerCase().indexOf(searchText) >= 0 ||
                   r.category.toLowerCase().indexOf(searchText) >= 0;
        });

        filtered.sort(function(a, b) {
            if (currentSort === 'distance') return getDistance(a) - getDistance(b);
            if (currentSort === 'rating') return b.rating - a.rating;
            if (currentSort === 'price') return a.avgPrice - b.avgPrice;
            return 0;
        });

        var container = document.getElementById('restaurant-list');
        if (filtered.length === 0) {
            container.innerHTML = '<div class="empty-state">没有找到匹配的餐厅</div>';
            return;
        }

        container.innerHTML = filtered.map(function(r) {
            var dist = formatDistance(getDistance(r));
            return '<div class="restaurant-card" onclick="showDetail(' + r.id + ',\'list\')">' +
                '<div class="card-row1">' +
                    '<div class="card-name">' + r.name + '</div>' +
                    '<div class="card-rating">\u2605 ' + r.rating + '</div>' +
                '</div>' +
                '<div class="card-row2">' +
                    '<span class="badge">' + r.category + '</span>' +
                    '<span class="price-tag">\u00a5' + r.avgPrice + '/人</span>' +
                    '<span>\u00b7</span>' +
                    '<span class="dist-tag">' + dist + '</span>' +
                '</div>' +
                '<div class="card-row3">' + r.address + '</div>' +
            '</div>';
        }).join('');
    }

                            rv.user +
                        '</div>' +
                        '<div class="review-date">' + rv.date + '</div>' +
                    '</div>' +
                    '<div style="margin-bottom:4px;">' + renderStars(rv.rating) + '</div>' +
                    '<div class="review-text">' + rv.text + '</div>' +
                    (rv.photo ? '<img class="review-photo" src="' + rv.photo + '" alt="评论图片">' : '') +
                '</div>';
            });
        }

        html += '<div class="review-form">' +
            '<div class="section-title" style="margin-bottom:14px;">发表评论</div>' +
            '<div class="form-group">' +
                '<label class="form-label">评分</label>' +
                '<div class="rating-input" id="rating-input">' +
                    '<span class="star-btn active" data-val="1">\u2605</span>' +
                    '<span class="star-btn active" data-val="2">\u2605</span>' +
                    '<span class="star-btn active" data-val="3">\u2605</span>' +
                    '<span class="star-btn active" data-val="4">\u2605</span>' +
                    '<span class="star-btn active" data-val="5">\u2605</span>' +
                '</div>' +
            '</div>' +
            '<div class="form-group">' +
                '<label class="form-label">昵称</label>' +
                '<input type="text" class="form-input" id="review-name" placeholder="匿名用户">' +
            '</div>' +
            '<div class="form-group">' +
                '<label class="form-label">评论内容</label>' +
                '<textarea class="form-textarea" id="review-text" placeholder="分享你的用餐体验..."></textarea>' +
            '</div>' +
            '<div class="form-group">' +
                '<label class="form-label">上传照片</label>' +
                '<div class="photo-upload">' +
                    '<label class="photo-upload-label">' +
                        '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>' +
                        '选择照片' +
                        '<input type="file" accept="image/*" id="review-photo" style="display:none;">' +
                    '</label>' +
                    '<div id="photo-preview-container"></div>' +
                '</div>' +
            '</div>' +
            '<button class="submit-btn" onclick="submitReview(' + r.id + ')">发表评论</button>' +
        '</div>';

        document.getElementById('restaurant-detail').innerHTML = html;
        setupRatingInput();
        setupPhotoUpload();
    }

    function setupRatingInput() {
        var stars = document.querySelectorAll('#rating-input .star-btn');
        stars.forEach(function(star) {
            star.addEventListener('click', function() {
                selectedRating = parseInt(this.dataset.val);
                stars.forEach(function(s, i) {
                    s.classList.toggle('active', i < selectedRating);
                });
            });
        });
    }

    function setupPhotoUpload() {
        uploadedPhoto = null;
        var input = document.getElementById('review-photo');
        if (!input) return;
        input.addEventListener('change', function() {
            var file = this.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                showToast('图片太大，请选择5MB以内的图片');
                return;
            }
            resizeImage(file, 600, function(dataUrl) {
                uploadedPhoto = dataUrl;
                var container = document.getElementById('photo-preview-container');
                container.innerHTML = '<img class="photo-preview" src="' + dataUrl + '" alt="预览">';
            });
        });
    }

    function submitReview(restaurantId) {
        var nameInput = document.getElementById('review-name');
        var textInput = document.getElementById('review-text');
        var name = nameInput.value.trim() || '匿名用户';
        var text = textInput.value.trim();
        if (!text) {
            showToast('请输入评论内容');
            return;
        }
        var now = new Date();
        var dateStr = now.getFullYear() + '-' +
                      String(now.getMonth() + 1).padStart(2, '0') + '-' +
                      String(now.getDate()).padStart(2, '0');
        var review = {
            user: name,
            rating: selectedRating,
            text: text,
            date: dateStr,
            photo: uploadedPhoto
        };
        saveReview(restaurantId, review);
        selectedRating = 5;
        uploadedPhoto = null;
        renderDetail(restaurantId);
        showToast('评论发表成功！');
    }

    /* ==================== 初始化 ==================== */

    function init() {
        initMap();
        renderList('distance');
        document.querySelectorAll('.sort-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                renderList(this.dataset.sort);
            });
        });
        document.getElementById('search-input').addEventListener('input', function() {
            renderList(currentSort);
        });
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
